<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>PHYSICS_EXP</title><link rel="stylesheet" href="../../../shared/styles.css">
<style>body{margin:0;overflow:hidden;background:#0f172a}</style></head><body>
<div class="instructions-overlay" id="instructions"><h1>⚛️ Physics Simulation</h1><p>Interactive physics sandbox. Click to add objects, watch them interact.</p>
<button class="btn btn-primary" onclick="hideInstructions()">Start</button></div>
<canvas id="canvas"></canvas>
<div class="controls-panel"><button class="btn btn-icon" onclick="reset()">↻</button><button class="btn btn-icon" onclick="saveImage()">⬇</button>
<button class="btn" onclick="window.location.href='../../../index.html'">← Gallery</button></div>
<script src="../../../shared/utils.js"></script>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let w,h,objects=[];

class PhysicsObject{
constructor(x,y){this.x=x;this.y=y;this.vx=Utils.random(-2,2);this.vy=Utils.random(-2,2);
this.r=Utils.random(10,30);this.color=Color.random()}
update(){this.vy+=.2;this.x+=this.vx;this.y+=this.vy;
if(this.y+this.r>h){this.y=h-this.r;this.vy*=-.8}
if(this.x-this.r<0||this.x+this.r>w){this.vx*=-.8;this.x=Utils.constrain(this.x,this.r,w-this.r)}}
draw(){ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill()}}

function init(){w=window.innerWidth;h=window.innerHeight;canvas.width=w;canvas.height=h;
canvas.addEventListener('click',e=>objects.push(new PhysicsObject(e.clientX,e.clientY)));
for(let i=0;i<5;i++)objects.push(new PhysicsObject(Utils.random(0,w),Utils.random(0,h/2)));
animate()}

function animate(){ctx.fillStyle='rgba(15,23,42,0.1)';ctx.fillRect(0,0,w,h);
objects.forEach(o=>{o.update();o.draw()});requestAnimationFrame(animate)}

function reset(){objects=[];for(let i=0;i<5;i++)objects.push(new PhysicsObject(Utils.random(0,w),Utils.random(0,h/2)))}
function saveImage(){Canvas.download(canvas,'physics-sim.png')}
function hideInstructions(){document.getElementById('instructions').classList.add('hidden')}
window.addEventListener('load',init)
</script></body></html>
